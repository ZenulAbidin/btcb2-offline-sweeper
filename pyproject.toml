[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btcb2-offline-sweeper"
version = "0.1.0"
description = "Guided offline signing and online transfer tools for BTCB2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "prompt-toolkit==3.0.53",
    "coincurve==21.0.0",
    "mnemonic==0.21",
]

[tool.setuptools.packages.find]
include = ["btcb2_tui*", "segwit*", "legacy*"]
namespaces = true

[tool.setuptools.package-data]
segwit = ["UPSTREAM_COPYING"]
legacy = ["UPSTREAM_COPYING"]
