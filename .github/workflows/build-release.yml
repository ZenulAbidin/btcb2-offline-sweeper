name: Test, build, and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run the original signers and application checks
        run: python scripts/run_tests.py

  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Require the tag to match the application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ExpectedTag = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -ne $ExpectedTag) {
            throw "Tag must match pyproject.toml version ($ExpectedTag)."
          }
      - name: Install locked dependencies, test, build, and smoke test both EXEs
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify the complete release inventory
        run: python scripts/release_assets.py --require-clean
      - name: Read the checked release version
        id: release-version
        shell: pwsh
        run: |
          $Version = python -c "import sys; sys.path.insert(0, 'scripts'); from release_assets import current_version; print(current_version())"
          if ($LASTEXITCODE -ne 0) { throw "Could not read release version." }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            dist/BTCB2-Offline.exe
            dist/BTCB2-Online.exe
            dist/BTCB2-Offline-v${{ steps.release-version.outputs.version }}-windows-x64.zip
            dist/BTCB2-Online-v${{ steps.release-version.outputs.version }}-windows-x64.zip
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify the exact downloaded inventory and source provenance
        run: python scripts/release_assets.py --require-clean
      - name: Publish the tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_assets.py --publish "$RELEASE_TAG"
